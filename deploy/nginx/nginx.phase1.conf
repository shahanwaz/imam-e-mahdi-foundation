# ==============================================================================
# NGINX Configuration — Phase 1: Single VPS Deployment
# Domain: imammission.org & www.imammission.org
# Reverse Proxy to: http://127.0.0.1:3000 (Next.js Standalone Node Server)
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name imammission.org www.imammission.org;

    # Let's Encrypt ACME Challenge Directory
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://imammission.org$request_uri;
    }
}

# 2. Redirect WWW HTTPS to Canonical Apex Domain HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.imammission.org;

    ssl_certificate /etc/letsencrypt/live/imammission.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imammission.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://imammission.org$request_uri;
}

# 3. Main Production Server Block (Apex Domain)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name imammission.org;

    # SSL / TLS 1.3 Hardened Parameters
    ssl_certificate /etc/letsencrypt/live/imammission.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imammission.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    client_max_body_size 50M;

    # Next.js Static Cache Optimization (_next/static)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public Static Assets Cache Optimization (images, icons, fonts)
    location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js|woff2|woff|ttf)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Rate Limiting on Authentication Routes
    location ~ ^/api/auth/(login|register|2fa) {
        limit_req zone=auth_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # General API Routes
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Main Application Proxy (SSR & Client Routes)
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        
        # WebSocket & Server-Sent Events (SSE) Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
