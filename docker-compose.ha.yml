# ==============================================================================
# IMF-DOS Phase 2: High-Availability Distributed Multi-Tier Stack
# Topologies:
#   - Load Balancer (Nginx)
#   - Scaled App Pods (App Server 1 & App Server 2)
#   - Dedicated PostgreSQL Primary + Read Replica
#   - Dedicated Redis Cache & BullMQ Queue
#   - Distributed S3 / MinIO Object Storage
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # Tier 1: High-Availability Edge Load Balancer
  # ----------------------------------------------------------------------------
  load-balancer:
    image: nginx:alpine
    container_name: imf-ha-load-balancer
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.ha.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_volume:/etc/letsencrypt:ro
    depends_on:
      - app-server-1
      - app-server-2

  # ----------------------------------------------------------------------------
  # Tier 2: Horizontally Scaled Next.js Application Pods
  # ----------------------------------------------------------------------------
  app-server-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imf-ha-app-1
    restart: always
    environment: &app-env
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-imf_admin}:${DB_PASSWORD}@db-primary:5432/${DB_NAME:-imf_production}?schema=public
      - DATABASE_READ_REPLICA_URL=postgresql://${DB_USER:-imf_admin}:${DB_PASSWORD}@db-replica:5432/${DB_NAME:-imf_production}?schema=public
      - REDIS_URL=redis://redis-server:6379
      - STORAGE_DRIVER=s3
      - S3_ENDPOINT=http://minio-storage:9000
      - S3_BUCKET_NAME=imf-documents-vault
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-imf_storage_admin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY_PII=${ENCRYPTION_KEY_PII}
      - QR_HMAC_SECRET=${QR_HMAC_SECRET}
      - RECEIPT_SIGNING_SECRET=${RECEIPT_SIGNING_SECRET}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - NEXT_PUBLIC_SITE_URL=https://imammission.org
      - NEXT_PUBLIC_APP_URL=https://imammission.org
    depends_on:
      db-primary:
        condition: service_healthy
      redis-server:
        condition: service_healthy
      minio-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  app-server-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: imf-ha-app-2
    restart: always
    environment: *app-env
    depends_on:
      db-primary:
        condition: service_healthy
      redis-server:
        condition: service_healthy
      minio-storage:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Tier 3: Dedicated Database Layer (Primary + Read Replica)
  # ----------------------------------------------------------------------------
  db-primary:
    image: postgres:16-alpine
    container_name: imf-ha-db-primary
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-imf_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-imf_production}
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-imf_admin} -d ${DB_NAME:-imf_production}"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-replica:
    image: postgres:16-alpine
    container_name: imf-ha-db-replica
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-imf_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-imf_production}
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    depends_on:
      - db-primary

  # ----------------------------------------------------------------------------
  # Tier 4: Dedicated Redis Cache & BullMQ Queue Cluster
  # ----------------------------------------------------------------------------
  redis-server:
    image: redis:7-alpine
    container_name: imf-ha-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_ha_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Tier 5: S3-Compatible Distributed Object Storage (MinIO)
  # ----------------------------------------------------------------------------
  minio-storage:
    image: minio/minio:latest
    container_name: imf-ha-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-imf_storage_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  certs_volume:
  pg_primary_data:
  pg_replica_data:
  redis_ha_data:
  minio_data:
